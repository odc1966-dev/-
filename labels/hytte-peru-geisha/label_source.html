<meta charset="utf-8">
<style>
  @page { margin:0 }
  html,body{margin:0;padding:0;background:#fff;width:960px;height:288px;overflow:hidden}
  *{box-sizing:border-box}
  #label{
    width:960.0px;height:288.0px;background:#fff;color:#000;
    border:6.72px solid #000;border-radius:19.2px;
    font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding:12.0px 15.84px 10.08px 15.84px;
  }
  .top{display:flex;flex:1 1 auto;min-height:0}
  .left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;padding-right:13.2px}
  .brand{font-size:29.28px;font-weight:700;letter-spacing:2.04px;line-height:1;white-space:nowrap}
  .name{font-size:79.2px;font-weight:700;letter-spacing:-0.72px;line-height:1;white-space:nowrap;margin-top:7.2px}
  .notes{display:flex;gap:8.16px;margin-top:auto}
  .chip{display:flex;align-items:center;gap:5.28px;border:4.8px solid #000;border-radius:36.0px;
        padding:0 11.52px 0 6.24px;height:70.08px}
  .chip span{font-size:34.56px;font-weight:700;line-height:1;letter-spacing:-0.36px;white-space:nowrap}
  .chip svg{display:block;width:51.84px;height:51.84px;flex:0 0 auto}
  .divider{width:5.28px;background:#000;margin-right:14.88px;align-self:stretch}
  .right{flex:0 0 auto;display:flex;flex-direction:column;justify-content:space-between;padding:0.48px 0 2.88px 0}
  .spec{font-size:43.2px;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:-0.48px}
  .bottom{display:flex;align-items:center;gap:16.8px;border-top:5.28px solid #000;
          margin-top:7.68px;padding-top:7.2px;height:54.72px}
  .sub{font-size:31.2px;font-weight:700;line-height:1;white-space:nowrap}
  .roast{margin-left:auto;display:flex;align-items:center;gap:10.8px}
  .roast b{font-size:31.2px;font-weight:700;line-height:1}
  .blank{width:244.8px;height:5.28px;background:#000;align-self:center;margin-top:14.4px}
</style>
